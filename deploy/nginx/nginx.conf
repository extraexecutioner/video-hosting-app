user nginx;
worker_processes auto;

worker_rlimit_nofile 32768;

events {
    worker_connections 4096;
    use epoll;

    multi_accept on;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=7s;

    upstream register-services {
        least_conn;

        server video-hosting-app-register-service-1:5000;
        server video-hosting-app-register-service-2:5000;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;
        return 444;
    }

    server {
        listen 80;
        listen [::]:80;

        server_name localhost;
        server_tokens off;

        gzip on;
        gzip_proxied any;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_types text/css text/javascript;

        location / {
            access_log off;

            proxy_pass http://frontend-service:80;
            add_header "Cache-Control" "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        location /users {
            access_log off;

            location = /users/auths {
                proxy_pass http://register-services;
            }

            location = /users/auths/codes {
                proxy_pass http://register-services;
            }

            return 400;
        }

        location ~* \.(css|js)$ {
            access_log off;
            
            proxy_pass http://frontend-service:80;
            add_header "Cache-Control" "public, max-age=31536000, immutable";
        }

        location ~* \.(ico|well-known/appspecific/com.chrome.devtools.json)$ {
            access_log off;
            return 204;
        }
    }
}