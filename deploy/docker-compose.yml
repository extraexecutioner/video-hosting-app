name: video-hosting-app

x-logging: &default_logging
    driver: json-file
    options:
        max-file: '3'
        max-size: '2m'

x-nginx-services-healthcheck: &nginx-services-healthcheck
    interval: 30s
    timeout: 3s
    retries: 1
    start_period: 5s
    test: wget --spider --no-verbose --tries=1 http://localhost:80/

x-nginx-services-update-config: &nginx-services-update-config
    order: start-first
    max_failure_ratio: 0
    failure_action: rollback
    monitor: 15s

services:
    nginx-proxy-service:
        image: dh-mirror.gitverse.ru/nginx:1.30.5-alpine-slim
        networks:
            - frontend-service-network
        ports:
            - "80:80"
        healthcheck:
            *nginx-services-healthcheck
        security_opt:
            - no-new-privileges:true
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        logging:
            *default_logging
        depends_on:
            frontend-service:
                condition: service_healthy
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
            update_config:
                *nginx-services-update-config
            resources:
                limits:
                    memory: 32M
                    cpus: '0.80'
                reservations:
                    memory: 8M

    frontend-service:
        image: frontend-service-image:latest
        networks:
            - frontend-service-network
        volumes:
            - ./nginx/nginx.web.conf:/etc/nginx/conf.d/default.conf:ro
        security_opt:
          - no-new-privileges:true
        healthcheck:
            *nginx-services-healthcheck
        logging:
            *default_logging
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
            update_config:
                *nginx-services-update-config
            resources:
                limits:
                    memory: 64M
                    cpus: '0.50'
                reservations:
                    memory: 16M
        
networks:
    frontend-service-network:
        driver: bridge