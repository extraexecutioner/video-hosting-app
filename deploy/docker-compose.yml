name: video-hosting-app

services:
    nginx-proxy-service:
        image: dh-mirror.gitverse.ru/nginx:1.30.5-alpine-slim
        networks:
            - frontend-service-network
        ports:
            - "80:80"
        healthcheck:
            interval: 30s
            timeout: 3s
            retries: 1
            start_period: 5s
            test: wget --spider --no-verbose --tries=1 http://localhost:80/
        security_opt:
            - no-new-privileges:true
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            frontend-service:
                condition: service_healthy
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
            update_config:
                order: start-first 
                max_failure_ratio: 0
                failure_action: rollback
                monitor: 15s
            resources:
                limits:
                    memory: 32M
                    cpus: '0.80'
                reservations:
                    memory: 8M

    frontend-service:
        image: frontend-service-image
        networks:
            - frontend-service-network
        volumes:
            - ./nginx/nginx.web.conf:/etc/nginx/conf.d/default.conf:ro
        security_opt:
          - no-new-privileges:true
        healthcheck:
            interval: 20s
            start_period: 5s
            retries: 1
            timeout: 3s
            test: wget --spider --no-verbose --tries=1 http://localhost:80
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
            update_config:
                order: start-first
                max_failure_ratio: 0
                failure_action: rollback
                monitor: 15s
            resources:
                limits:
                    memory: 64M
                    cpus: '0.50'
                reservations:
                    memory: 16M
        
networks:
    frontend-service-network:
        driver: bridge