name: video-hosting-app

x-logging: &default_logging
    driver: json-file
    options:
        max-file: '3'
        max-size: '2m'

x-nginx-services-healthcheck: &nginx-services-healthcheck
    interval: 30s
    timeout: 5s
    retries: 2
    start_period: 5s
    test: ["CMD-SHELL", "wget --spider --no-verbose --tries=1 http://localhost:80/"]

x-nginx-services-update-config: &nginx-services-update-config
    order: start-first
    max_failure_ratio: 0
    failure_action: rollback
    monitor: 15s

services:
    nginx-proxy-service:
        image: dh-mirror.gitverse.ru/nginx:1.30.5-alpine-slim
        networks:
            - frontend-service-network
            - register-service-network
        ports:
            - "80:80"
        healthcheck:
            *nginx-services-healthcheck
        security_opt:
            - no-new-privileges:true
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        logging:
            *default_logging
        depends_on:
            frontend-service:
                condition: service_healthy
            register-service:
                condition: service_healthy
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
                window: 3s
                max_attempts: 3
            update_config:
                *nginx-services-update-config
            resources:
                limits:
                    memory: 32M
                    cpus: '0.80'
                reservations:
                    memory: 8M

    frontend-service:
        image: frontend-service-image
        networks:
            - frontend-service-network
        volumes:
            - ./nginx/nginx.web.conf:/etc/nginx/conf.d/default.conf:ro
        security_opt:
          - no-new-privileges:true
        healthcheck:
            *nginx-services-healthcheck
        logging:
            *default_logging
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
                window: 3s
                max_attempts: 3
            update_config:
                *nginx-services-update-config
            resources:
                limits:
                    memory: 64M
                    cpus: '0.50'
                reservations:
                    memory: 16M

    register-service: 
        image: register-service-image
        networks:
            - register-service-network
            - postgres-service-network
        security_opt:
            - no-new-privileges:true
        volumes:
            - ../services/api/register-service/dist/bundle.cjs:/app/bundle.cjs:ro
        env_file:
            - ./env/postgres.env
            - ../services/api/register-service/.env
            - ../services/api/register-service/email-passwords.env
        depends_on:
            postgres-service:
                condition: service_healthy
        logging:
            *default_logging
        healthcheck:
            interval: 30s
            start_period: 5s
            retries: 1
            timeout: 3s
            test: ["CMD-SHELL", "curl -f -X OPTIONS http://localhost:$${SERVER_PORT}/healthchecks || exit 1"]
        deploy:
            mode: replicated
            replicas: 2

            restart_policy:
                condition: on-failure
                max_attempts: 3
                window: 3s
            update_config:
                order: start-first
                parallelism: 1
                max_failure_ratio: 0
                failure_action: rollback
            rollback_config:
                parallelism: 1
                order: start-first
                delay: 2s
            resources:
                limits:
                    memory: 312M
                    cpus: '0.50'
                reservations:
                    memory: 196M

    postgres-service:
        image: dockerhub.timeweb.cloud/library/postgres:17-alpine
        networks:
            - postgres-service-network
        env_file:
            - ./env/postgres.env
        volumes:
            - postgres-data:/var/lib/postgresql/data
        logging:
            *default_logging
        healthcheck:
            interval: 30s
            start_period: 5s
            retries: 5
            timeout: 5s
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
                max_attempts: 1
                window: 5s
            update_config:
                order: start-first
                failure_action: rollback
                max_failure_ratio: 0
            resources:
                limits:
                    memory: 1G
                    cpus: '0.80'
                reservations:
                    memory: 312M
            
volumes:
    postgres-data:

networks:
    frontend-service-network:
        driver: bridge

    register-service-network:
        driver: bridge

    postgres-service-network:
        driver: bridge